  if (a < 1000) return Math.floor(n).toString();
  let u = 0; while (Math.abs(n) >= 1000 && u < UNITS.length - 1) { n /= 1000; u++; }

function affVal(a, it) {
  const def = AFF_BY[a.k]; const [lo, hi] = def.t[a.t];
  let v = lo + (hi - lo) * a.roll;
  if (ST[a.k].flat) v *= growth(it.ilvl);
  if (!ST[a.k].fixed) v *= qMul(it.q);
  return roundStat(a.k, v);
}
function affRange(a, it) {
  const def = AFF_BY[a.k]; const [lo, hi] = def.t[a.t];
  const m = (ST[a.k].flat ? growth(it.ilvl) : 1) * (ST[a.k].fixed ? 1 : qMul(it.q));
  return [roundStat(a.k, lo * m), roundStat(a.k, hi * m)];
}
function roundStat(k, v) {
