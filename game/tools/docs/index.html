<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>设计文档</title>
<style>
:root { --bg: #14121a; --card: #1e1b27; --line: #34303f; --text: #ece6f5; --dim: #a59fb3; --accent: #f0a35e; --good: #7fd18b; --bad: #ff8a7a; }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px }
h1 { font-size: 24px; line-height: 1.3; margin: 8px 0 12px }
h2 { font-size: 20px; margin: 28px 0 8px; padding-top: 12px; border-top: 1px solid var(--line) }
h3 { font-size: 17px; margin: 20px 0 6px; color: var(--accent) }
p, li { color: var(--text) } a { color: var(--accent) }
blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--card); color: var(--dim); border-radius: 0 8px 8px 0 }
table { width: 100%; border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; margin: 8px 0 }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; min-width: 72px }
th { background: var(--card) }
code { background: var(--card); padding: 1px 5px; border-radius: 4px; font-size: 14px }
button, input, textarea { font: inherit; color: inherit }
.nb { margin: 6px 0 4px; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--dim) }
.nb.has { color: var(--accent); border-color: var(--accent) }
.box { margin: 8px 0 12px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card) }
.box textarea { width: 100%; min-height: 64px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; resize: vertical }
.note { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px } .note:last-child { border-bottom: 0 }
.note .when { color: var(--dim); font-size: 12px; margin-right: 8px } .note .del { float: right; background: none; border: 0; color: var(--bad); font-size: 13px }
.btn { padding: 7px 14px; border-radius: 10px; border: 0; background: var(--accent); color: #1a1208; font-weight: 600 }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(20,18,26,.96); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); font-size: 14px; color: var(--dim) }
.bar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: center }
.bar input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg) }
</style></head>
<body><main id="doc">读取中…</main><div class="bar"><div class="in" id="bar"></div></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
// 通用设计文档页：读同目录的 doc.md，按小节（h2 / h3）加批注；批注存服务器 /api/<页面>/notes（同源口令和图鉴共用）
const PAGE = location.pathname.split('/').filter(Boolean)[1] || 'doc', API = '/api/' + PAGE + '/notes', TK = 'ash-pages-token';
let token = ''; try { token = localStorage.getItem(TK) || ''; } catch (e) {}
let notes = [], status = '', open = null;
const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const api = (m, p, b) => fetch(p, { method: m, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then(r => { if (r.status === 401) throw new Error('口令不对'); if (!r.ok) throw new Error('服务器 ' + r.status); return r.json(); });
async function load() { if (!token) return bar(); try { notes = (await api('GET', API)).map(x => ({ ...x.data, _id: x.id })); status = ''; } catch (e) { status = e.message; } decorate(); bar(); }
function bar() {
  $('bar').innerHTML = token ? `<span style="flex:1">${status ? '同步失败：' + esc(status) : `批注 ${notes.length} 条 · 已同步，Claude 能直接看到`}</span>`
    : `<input id="tok" type="password" placeholder="同步口令（只有作者需要）"><button class="btn" id="tokS">保存</button>`;
}
function sections() { return [...document.querySelectorAll('#doc h2, #doc h3')]; }
function decorate() {
  document.querySelectorAll('.nb, .box').forEach(x => x.remove());
  for (const h of sections()) {
    const ns = notes.filter(n => n.k === h.id), b = document.createElement('button');
    b.className = 'nb' + (ns.length ? ' has' : ''); b.dataset.k = h.id; b.textContent = ns.length ? `批注 ${ns.length}` : (token ? '＋ 批注' : '');
    if (!token && !ns.length) continue;
    h.after(b);
    if (open === h.id) { const box = document.createElement('div'); box.className = 'box'; box.innerHTML = ns.map(n => `<div class="note"><span class="when">${new Date(n.ts).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>${esc(n.text)}${token ? `<button class="del" data-del="${n._id}">删除</button>` : ''}</div>`).join('') + (token ? `<textarea id="nt" placeholder="对这一节的意见"></textarea><div style="margin-top:6px;text-align:right"><button class="btn" id="ns">保存</button></div>` : ''); b.after(box); }
  }
}
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.id === 'tokS') { const v = ($('tok').value || '').trim(); if (!v) return; token = v; try { localStorage.setItem(TK, v); } catch (er) {} return load(); }
  if (t.classList.contains('nb')) { open = open === t.dataset.k ? null : t.dataset.k; decorate(); return; }
  if (t.id === 'ns') { const text = $('nt').value.trim(); if (!text) return; const h = document.getElementById(open), n = { k: open, label: h ? h.textContent : open, text, ts: Date.now() };
    try { const x = await api('POST', API, n); notes.push({ ...n, _id: x.id }); status = ''; } catch (er) { status = er.message; } decorate(); bar(); return; }
  if (t.dataset.del) { try { await api('DELETE', API + '/' + t.dataset.del); notes = notes.filter(n => n._id !== t.dataset.del); } catch (er) { status = er.message; } decorate(); bar(); }
});
fetch('doc.md', { cache: 'no-cache' }).then(r => r.text()).then(md => {
  const slug = {}, ren = new marked.Renderer();
  ren.heading = (text, level, raw) => { let id = raw.replace(/[^\w一-龥]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'h'; slug[id] = (slug[id] || 0) + 1; if (slug[id] > 1) id += '-' + slug[id]; return `<h${level} id="${id}">${text}</h${level}>`; };
  $('doc').innerHTML = marked.parse(md, { renderer: ren }); document.title = (document.querySelector('#doc h1') || {}).textContent || '设计文档';
  decorate(); bar(); load();
}).catch(() => { $('doc').textContent = '文档没有读到，刷新一下。'; });
</script></body></html>
