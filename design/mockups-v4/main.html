<!doctype html><meta charset=utf-8><link rel=stylesheet href=style.css>
<style>
.bar{display:flex;gap:10px;justify-content:center;padding:4px 12px}
.ts{width:80px;height:92px;border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative}
.ts img{width:52px}.ts.sel{outline:4px solid #fff;outline-offset:2px;transform:translateY(-4px)}
.ts .n{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}
.lock{background:linear-gradient(#6a7090,#4a4f6a);flex-direction:column;font-size:15px}
.big{margin:22px 12px 0;padding:14px 12px 18px}
.ti{display:flex;align-items:center;gap:10px;font-size:20px}.ti img{width:44px}
.info{margin-left:auto;width:30px;height:30px;border-radius:50%;border:3px solid #1a1426;background:#6fc8ff;display:flex;align-items:center;justify-content:center;font-size:17px}
.socks{display:flex;justify-content:center;align-items:center;margin-top:18px;position:relative}
.k{width:66px;height:66px;display:flex;align-items:center;justify-content:center;border:4px solid #1a1426;box-shadow:0 5px 0 #1a1426,inset 0 3px 0 #fff7}
.k img{width:46px}.sk{border-radius:16px;background:linear-gradient(#ffb36a,#f06a2a)}
.sp{border-radius:50%;background:linear-gradient(#8fd8ff,#3a8ae8)}
.em{border-radius:50%;background:#2c3460;border-style:dashed;color:#7f8ac0;font-size:30px;box-shadow:inset 0 3px 0 #0006}
.ln{width:14px;height:8px;background:#1a1426}
.ln.on{background:#ffe36a;box-shadow:0 0 10px 3px #ffd23a}
.glow{box-shadow:0 0 14px 5px #ffe36a,0 5px 0 #1a1426}
.off{filter:grayscale(1) brightness(.7)}
.hint{position:absolute;inset:-6px;border-radius:50%;border:4px solid #7cf05a;box-shadow:0 0 16px 4px #7cf05a;animation:none}
.inv{position:absolute;left:0;right:0;bottom:74px;padding:10px 10px 14px;background:linear-gradient(#3b4677,#2a3158);border-top:3px solid #1a1426}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs .btn{height:36px;font-size:14px;padding:0 14px}
.gg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.gg .k{width:62px;height:62px}
.pick{outline:4px solid #fff;outline-offset:3px;transform:translateY(-6px)}
.dimg{opacity:.35}
.pw{text-align:center;margin-top:16px;font-size:30px}
.tip{position:absolute;left:24px;right:24px;top:400px;padding:10px;font-size:15px;text-align:center}

.nav2{position:absolute;left:6px;right:6px;bottom:6px;height:72px;background:linear-gradient(#4a5694,#2d3566);border:4px solid #1a1426;border-radius:22px;box-shadow:0 5px 0 #1a1426,inset 0 3px 0 #ffffff40;display:flex;justify-content:space-around;align-items:center;padding:0 4px}
.tb{width:64px;text-align:center;position:relative;font-size:12px;color:#aab3dc}
.tb svg{width:38px;height:38px;display:block;margin:0 auto 1px;filter:saturate(.35) brightness(.85)}
.tb.on{width:78px;height:86px;margin-top:-30px;background:linear-gradient(#ffe066,#ffb31a);border:4px solid #1a1426;border-radius:18px;box-shadow:0 5px 0 #1a1426,inset 0 3px 0 #fff8,inset 0 -6px 0 #c46a00;color:#fff;font-size:15px;padding-top:6px}
.tb.on svg{width:52px;height:52px;filter:none}
.dot{position:absolute;top:-4px;right:6px;width:18px;height:18px;border-radius:50%;background:#ff3b3b;border:3px solid #1a1426;font-size:10px;line-height:12px;color:#fff}
.tb.on .dot{right:-6px;top:-8px}
.tb.lk svg{opacity:.35}.tb .lki{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:20px}
.inv{bottom:84px!important}
</style>
<div class=hdr><div class="ribbon o">触发器</div></div>
<div class=bar>
 <div class="ts slot q-r sel"><img src=assets/t_attack.png><span class="n o">攻击时</span></div>
 <div class="ts slot q-u"><img src=assets/t_kill.png><span class="n o">击杀时</span></div>
 <div class="ts slot lock"><div style=font-size:28px>🔒</div><span class=o>Lv15</span></div>
 <div class="ts slot lock"><div style=font-size:28px>🔒</div><span class=o>Lv35</span></div>
</div>
<div class="card big">
 <div class=ti><img src=assets/t_attack.png><span class=o>攻击时</span><span class=stars>★★★★</span><div class="info o">i</div></div>
 <div class=socks id=socks></div>

</div>

 <div class=tabs><div class="btn yel o">全部</div><div class="btn gry o">技能</div><div class="btn gry o">辅助</div><div class="btn blu o" style=margin-left:auto>触发器 3</div></div>
 <div class=gg id=gg></div>
</div>
<script>
const NAV=sel=>`<div class=nav2><div class="tb o"><svg viewBox="0 0 48 48"><path d="M8 6h32l-3 22c-1 8-8 14-13 16-5-2-12-8-13-16z" fill="#6fc8ff" stroke="#1a1426" stroke-width="4" stroke-linejoin="round"/><path d="M24 12v26" stroke="#fff" stroke-width="4"/></svg>装备<span class="dot o">!</span></div><div class="tb  o"><svg viewBox="0 0 48 48"><path d="M6 14h30c0 6 6 8 8 8v4H34v6h6v8H10v-8h6v-6c-6 0-10-6-10-12z" fill="#b9bfd6" stroke="#1a1426" stroke-width="4" stroke-linejoin="round"/></svg>铁砧</div><div class="tb on o"><svg viewBox="0 0 48 48"><path d="M27 3 9 27h13l-4 18 21-26H26z" fill="#fff36a" stroke="#1a1426" stroke-width="4" stroke-linejoin="round"/></svg>触发器</div><div class="tb o"><svg viewBox="0 0 48 48"><path d="M24 4l6 13 14 2-10 10 3 14-13-7-13 7 3-14L4 19l14-2z" fill="#e08cff" stroke="#1a1426" stroke-width="4" stroke-linejoin="round"/></svg>天赋<span class="dot o">!</span></div><div class="tb lk o"><svg viewBox="0 0 48 48"><path d="M14 4v40M34 4v40M14 12h20M14 22h20M14 32h20" stroke="#1a1426" stroke-width="9" stroke-linecap="round"/><path d="M14 4v40M34 4v40M14 12h20M14 22h20M14 32h20" stroke="#ffa64a" stroke-width="4" stroke-linecap="round"/></svg>Lv20<span class=lki>🔒</span></div></div>`;
document.body.insertAdjacentHTML('beforeend',NAV());

const sel=location.search.includes('sel'), cmp=location.search.includes('cmp');
const K=(c,g,x='')=>`<div class="k ${c} ${x}"><img class=px src=assets/${g}.png></div>`;
const L=o=>`<div class="ln ${o?'on':''}"></div>`;
socks.innerHTML=K('sk','GemWhirl','glow')+L(1)+K('sp','r_AreaOfEffect','glow')+L(1)+K('sp','r_AttackSpeed','glow')+L(0)+(sel?'<div style=position:relative>'+K('em','x').replace(/<img[^>]*>/,'＋')+'<div class=hint></div></div>':K('em','x').replace(/<img[^>]*>/,'＋'));
const inv=[['sp','r_Aftershock'],['sp','r_Pierce'],['sk','GemMeteor'],['sp','r_Chain'],['sk','GemFrostOrb'],['sp','r_Melee'],['sp','r_Split'],['sk','GemFirepot'],['sp','r_Thermal'],['sp','r_Boomerang']];
gg.innerHTML=inv.map((a,i)=>K(a[0],a[1],sel&&i==0?'pick glow':(sel&&a[1]=='r_Pierce'?'dimg':''))).join('');
if(sel)extra.innerHTML='<div class="card tip o">点亮的孔 = 可放入　再点宝石 = 自动放入</div>';
if(cmp){document.body.insertAdjacentHTML('beforeend',`<div style="position:absolute;inset:0;background:#000a"></div>
<div class=card style="position:absolute;left:20px;right:20px;top:170px;padding:16px;text-align:center">
<div class="ribbon o" style="display:inline-block;margin-top:-34px">获得触发器！</div>
<div style="display:flex;justify-content:space-around;margin-top:14px">
 <div><div class="slot q-r" style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin:auto"><img src=assets/t_attack.png width=64></div><div class="o" style=margin-top:8px>当前</div><div style=font-size:22px class=o>⚪⚪⚪⚪</div></div>
 <div style="font-size:30px;align-self:center" class=o>➜</div>
 <div><div class="slot q-u glow" style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin:auto"><img src=assets/t_crit.png width=64></div><div class="o y" style=margin-top:8px>暴击时</div><div style=font-size:22px class=o>⚪⚪⚪⚪⚪</div></div>
</div>
<div class="o g" style="font-size:34px;margin:12px 0">▲ +18%</div>
<div style="display:flex;gap:12px;justify-content:center"><div class="btn gry o">分解</div><div class="btn grn o" style="padding:0 34px">替换</div></div>
<div class="dim" style="margin-top:10px;font-size:12px">宝石自动搬过去</div></div>`)}
if(location.search.includes('nav')){document.body.innerHTML='<div style="padding:30px 0;text-align:center" class="o y">选中 / 未选中 / 红点 / 锁定</div>'+['on','',''].map((x,i)=>'<div style="position:relative;height:150px">'+NAV().replace('tb gear',x)+'</div>').join('');
const bars=document.querySelectorAll('.nav2');bars[1].querySelectorAll('.tb')[2].classList.remove('on');bars[1].querySelectorAll('.tb')[0].classList.add('on');bars[2].querySelectorAll('.tb')[2].classList.remove('on');bars[2].querySelectorAll('.tb')[3].classList.add('on');}
</script>
