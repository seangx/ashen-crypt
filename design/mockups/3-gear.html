<!doctype html><meta charset=utf-8><link rel=stylesheet href=style.css><style>.aff{padding:3px 0}.sock{width:52px;height:52px;border:2px solid #4a3d55;background:#120e17;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:9px;gap:4px}
.pick{display:flex;align-items:center;gap:10px;padding:8px;border:2px solid #2f2738;margin-bottom:6px;background:#231c2b}</style><body>
<div class=top>装备 · 头冠</div>
<div class=panel style="margin:12px;padding:12px">
 <div style="display:flex;gap:10px;align-items:center"><img src="ico/i_a_crystalcrown.png" style="width:48px;height:48px"><div><div class=yel style="font-size:16px;font-weight:700">晶冠 · 稀有</div><div class=dim>头冠 · 物品等级 38</div></div></div>
 <div style="margin-top:8px"><div class=aff>护盾 +210</div><div class=aff>生命 +8%</div><div class=aff class=blue>盘格技能伤害 <b class=blue>+9%</b></div><div class=aff>冰抗 +14%</div></div>
 <div style="margin-top:10px" class=gold>镶孔 2/3</div>
 <div style="display:flex;gap:8px;margin-top:6px">
  <div class=sock><span class=gemd style="background:#ff6b6b"></span>赤焰 T3</div>
  <div class=sock><span class=gemd style="background:#9a8fa6"></span>铁骨 T2</div>
  <div class=sock style="border-color:#c8913a;border-style:dashed;color:#f2c46a">＋<br>空孔</div></div>
 <div class=dim style="font-size:11px;margin-top:6px">防具部位：赤焰石 = 生命 +%，铁骨石 = 护甲 +%</div></div>
<div class=scrim style="top:0"></div>
<div class=sheet>
 <div class=gold style="font-weight:700">镶入第 3 孔 · 头冠（防具效果）</div>
 <div class=dim style="font-size:11px;margin:4px 0 10px">按“镶在这里的效果”排序 · 同种石头一件装备只生效一颗</div>
 <div class=pick style="border-color:#c8913a"><span class=gemd style="background:#ffffff;outline:0"></span><div style="flex:1"><b>影石 T3</b><div class=dim style="font-size:11px">闪避 +6（上限 40）</div></div><span class=gold>×2</span></div>
 <div class=pick><span class=gemd style="background:#7fe3f0"></span><div style="flex:1"><b>冰系石 T4</b><div class=dim style="font-size:11px">冰抗 +18%（武器上：冰系伤害 +22%）</div></div><span class=dim>×1</span></div>
 <div class=pick><span class=gemd style="background:#c98cff"></span><div style="flex:1"><b>灯芯石 T2</b><div class=dim style="font-size:11px">灯火上限 +8%</div></div><span class=dim>×3</span></div>
 <div class=pick style="opacity:.5"><span class=gemd style="background:#ff6b6b"></span><div style="flex:1"><b>赤焰石 T2</b><div class=dim style="font-size:11px">已有同种（不生效）</div></div><span class=dim>×4</span></div>
 <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px"><span class="btn ghost">取消</span><span class="btn pri">镶入 影石 T3</span></div>
</div>
