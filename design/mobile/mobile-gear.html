<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */
:root {
  --bg: #2a2433; --gold: #c8913a; --ember: #ff9a3c; --ink: #f4ead8; --muted: #d2c3b0;
  --font: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html { background: #120e16; }
body { width: 390px; height: 844px; margin: 0 auto; overflow: hidden; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--bg); }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.od-icon { image-rendering: pixelated; shape-rendering: crispEdges; }
.app { height: 844px; display: grid; grid-template-rows: 54px auto minmax(0, 1fr) auto 34px; background: var(--bg); }
.head { display: flex; align-items: center; justify-content: center; padding: 0 12px 8px; }
.plaque { min-width: 140px; text-align: center; padding: 4px 18px; background: #3a2a18; border: 2px solid var(--gold); color: #f6e2a8; }
.plaque b, .plaque span { display: block; }
.plaque b { font-size: 18px; line-height: 1.3; }
.plaque span { color: var(--ink); font-size: 16px; line-height: 1.3; }
.od-scroll { padding: 0 12px 12px; }
.doll { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.slot, .cell, .btn {
  border: 2px solid var(--gold); background: #241c2e; color: var(--ink);
  min-height: 44px; padding: 6px;
}
.slot, .cell {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;
}
.slot span, .cell span, .btn span { display: block; }
.slot { min-height: 76px; }
.cell { min-height: 72px; }
.r-普通 { border-color: #a89888; }
.r-魔法 { border-color: #8eb6ff; }
.r-稀有 { border-color: #c8913a; }
.r-传奇 { border-color: #ff9a3c; }
.up { color: #b6f3c8; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.od-stat { background: #1e1828; border: 2px solid #6a5433; padding: 6px 8px; }
.od-stat b { font-size: 18px; color: #f6e2a8; }
.od-stat span { color: var(--muted); }
.actions { display: flex; gap: 8px; margin-bottom: 8px; }
.btn { flex: 1 1 0; min-height: 48px; background: #2a2433; }
.btn-gold { background: var(--gold); color: #1a1208; border-color: #e2b86a; }
.hint { margin: 0 0 8px; color: var(--muted); }
.bag { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cell.is-empty { border-style: dashed; border-color: #6a5433; color: var(--muted); }
.nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #1a1522; border-top: 2px solid var(--gold); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; text-decoration: none; color: var(--muted); }
.nav a span { display: block; font-size: 16px; line-height: 1.2; }
.nav a[aria-current="page"] { color: var(--ember); box-shadow: inset 0 -3px 0 var(--ember); }
dialog.sheet { width: min(390px, 100vw); max-height: min(560px, 80vh); overflow: auto; margin: auto auto 0; border: 2px solid var(--gold); background: #322838; color: var(--ink); padding: 16px 16px 28px; }
dialog.sheet::backdrop { background: rgba(10, 8, 14, 0.72); }
dialog.sheet[open] { animation: sheet-in 200ms var(--ease); }
@keyframes sheet-in { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
dialog.sheet h2 { margin: 0; font-size: 20px; }
dialog.sheet p, dialog.sheet li { margin: 0; }
dialog.sheet ul { margin: 0; padding-left: 1.1em; }
.tier { color: #f0d78c; font-weight: 700; }
.dlg-actions { display: flex; gap: 8px; }
.dlg-actions button { flex: 1 1 0; min-height: 48px; border: 2px solid var(--gold); background: #241c2e; color: var(--ink); }
#askYes, #dClose { background: var(--gold); color: #1a1208; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
@media (hover: hover) {
  .slot:hover, .cell:hover, .btn:hover, .nav a:hover { border-color: var(--ember); background: #3a3148; }
  .nav a:hover { color: var(--ink); }
}
@media (prefers-reduced-motion: reduce) {
  dialog.sheet[open] { animation: none; }
}
</style>

<script>
(function () {

    crown: item('霜冠', 'head', '魔法', 40, '', 'helm', '霜冻王座掉落的头冠', ['护甲 +36', '生命 +40'], [['T3', '冰缓抗性提高 18%']], { life: 40, shield: 0, armor: 36, dodge: 0 }),
    neck: item('墓语项链', 'neck', '魔法', 28, '', 'neck', '低语会指出宝箱方向', ['生命 +20'], [['T2', '稀有掉落提高 6%']], { life: 20, shield: 0, armor: 10, dodge: 0 }),
    ring: item('余烬戒', 'ring', '稀有', 36, '', 'ring', '指节常年温热', ['闪避 +10%'], [['T4', '火焰伤害提高 12%']], { life: 15, shield: 0, armor: 0, dodge: 10 }),
    gloves: item('骨手套', 'hands', '魔法', 24, '', 'hands', '指节包着细骨', ['护甲 +24'], [['T3', '攻击速度提高 8%']], { life: 10, shield: 0, armor: 24, dodge: 0 }),
    boots: item('守夜靴', 'boots', '普通', 18, '', 'boots', '靴底沾着墓灰', ['生命 +30', '闪避 +6%'], [], { life: 30, shield: 0, armor: 21, dodge: 6 }),
    shield: item('寒铁盾', 'shield', '稀有', 80, '', 'shield', '盾面结着薄霜', ['护盾 307', '每秒回复 24.6'], [['T6', '护盾提高 22%']], { life: 120, shield: 307, armor: 80, dodge: 4 }),
    sword: item('裂骨剑', 'weapon', '普通', 20, '8.2K', 'sword', '普通直剑', ['物理伤害 8–14'], [], { life: 0, shield: 0, armor: 0, dodge: 0 }),
    hood: item('灰兜帽', 'head', '普通', 12, '', 'helm', '布满补丁', ['护甲 +6'], [], { life: 8, shield: 0, armor: 6, dodge: 0 }),
    copper: item('铜戒', 'ring', '普通', 8, '', 'ring', '没有词条', ['生命 +4'], [], { life: 4, shield: 0, armor: 0, dodge: 1 }),
    walk: item('行路靴', 'boots', '普通', 10, '', 'boots', '磨平的靴跟', ['生命 +6'], [], { life: 6, shield: 0, armor: 4, dodge: 1 }),
    wood: item('木盾', 'shield', '普通', 16, '', 'shield', '裂了一角', ['护盾 40'], [], { life: 10, shield: 40, armor: 8, dodge: 0 }),
    pendant: item('萤火坠', 'neck', '魔法', 30, '', 'neck', '坠子里有一点火', ['生命 +18'], [['T3', '灯火伤害提高 9%']], { life: 18, shield: 0, armor: 0, dodge: 0 }),
    bow: item('骨弓', 'weapon', '稀有', 110, '102K', 'sword', '比身上的武器更狠', ['物理伤害 40–90', '射程 48'], [['T7', '投射物伤害提高 28%']], { life: 0, shield: 0, armor: 0, dodge: 2 }),
    tomb: item('墓语戒', 'ring', '稀有', 48, '', 'ring', '戒面刻着层数', ['闪避 +12%'], [['T5', '暴击率提高 4%']], { life: 12, shield: 0, armor: 0, dodge: 12 }),
    glove2: item('烬甲手套', 'hands', '魔法', 32, '', 'hands', '甲片发烫', ['护甲 +28'], [['T4', '近战伤害提高 7%']], { life: 8, shield: 0, armor: 28, dodge: 0 }),
    night: item('夜行靴', 'boots', '稀有', 55, '', 'boots', '步伐更轻', ['闪避 +14%'], [['T6', '移动速度提高 8%']], { life: 16, shield: 0, armor: 12, dodge: 14 }),
    holy: item('圣铁盾', 'shield', '稀有', 70, '', 'shield', '盾缘镀金', ['护盾 180'], [['T5', '格挡回复生命 4']], { life: 40, shield: 180, armor: 48, dodge: 2 })
  };
  function item(name, slot, rarity, power, dps, icon, blurb, lines, affixes, bonus) {
    return { name: name, slot: slot, rarity: rarity, power: power, dps: dps, icon: icon, blurb: blurb, lines: lines, affixes: affixes, bonus: bonus };
  }
  var equipped = { head: 'crown', neck: 'neck', weapon: 'blade', ring: 'ring', hands: 'gloves', boots: 'boots', shield: 'shield' };
  var bag = ['sword', 'hood', 'copper', 'walk', 'wood', 'pendant', 'bow', 'tomb', 'glove2', 'night', 'holy', 'blade'];
  /* 回旋骨刃在身上，背包不重复放它 */
  bag = ['sword', 'hood', 'copper', 'walk', 'wood', 'pendant', 'bow', 'tomb', 'glove2', 'night', 'holy'];
  /* 再补一件，凑满参考里的 12 格 */
  items.lamp = item('魂灯', 'neck', '稀有', 44, '', 'neck', '提灯的残芯', ['灯火每秒 +0.4'], [['T5', '灯火范围提高 10%']], { life: 0, shield: 0, armor: 0, dodge: 0 });
  bag.push('lamp');

  var doll = document.getElementById('doll');
  var bagEl = document.getElementById('bag');
  var live = document.getElementById('live');
  var sheet = document.getElementById('sheet');
  var ask = document.getElementById('ask');
  var opener = null;
  var timer = null;
  var longFired = false;
  var pressBtn = null;

  function glyph(kind) {
    var paths = {
      sword: '<rect x="7" y="1" width="2" height="9" fill="currentColor"/><rect x="4" y="8" width="8" height="2" fill="currentColor"/><rect x="7" y="11" width="2" height="4" fill="currentColor"/>',
      helm: '<rect x="4" y="3" width="8" height="7" fill="currentColor"/><rect x="6" y="10" width="4" height="2" fill="currentColor"/>',
      neck: '<rect x="5" y="2" width="6" height="2" fill="currentColor"/><rect x="4" y="4" width="2" height="4" fill="currentColor"/><rect x="10" y="4" width="2" height="4" fill="currentColor"/><rect x="6" y="8" width="4" height="5" fill="currentColor"/>',
      ring: '<rect x="4" y="5" width="8" height="7" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="2" width="2" height="3" fill="currentColor"/>',
      hands: '<rect x="2" y="6" width="5" height="6" fill="currentColor"/><rect x="9" y="6" width="5" height="6" fill="currentColor"/>',
      boots: '<rect x="3" y="2" width="4" height="8" fill="currentColor"/><rect x="9" y="2" width="4" height="8" fill="currentColor"/><rect x="2" y="10" width="6" height="3" fill="currentColor"/><rect x="8" y="10" width="6" height="3" fill="currentColor"/>',
      shield: '<rect x="4" y="2" width="8" height="10" fill="currentColor"/><rect x="7" y="5" width="2" height="5" fill="#241c2e"/>'
    };
    var holder = document.createElement('span');
    holder.innerHTML = '<svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:18px">' + (paths[kind] || '') + '</svg>';
    return holder.firstChild;
  }

  function sum() {
    var total = { life: 200, shield: 0, armor: 40, dodge: 5 };
    Object.keys(equipped).forEach(function (key) {
      var it = items[equipped[key]];
      if (!it) return;
      total.life += it.bonus.life;
      total.shield += it.bonus.shield;
      total.armor += it.bonus.armor;
      total.dodge += it.bonus.dodge;
    });
    return total;
  }

  function betterThanWorn(it) {
    var worn = items[equipped[it.slot]];
    if (!worn) return true;
    return it.power > worn.power;
  }

  function makeBtn(it, where, slotKey) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = (where === 'doll' ? 'slot ' : 'cell ') + (it ? 'r-' + it.rarity : 'is-empty');
    btn.dataset.where = where;
    if (slotKey) btn.dataset.slot = slotKey;
    if (it) btn.dataset.id = it === items[equipped[slotKey]] || where === 'bag' ? (where === 'bag' ? bagId(it) : equipped[slotKey]) : '';
    return btn;
  }

  function bagId(it) {
    var ids = Object.keys(items);
    for (var i = 0; i < ids.length; i++) if (items[ids[i]] === it) return ids[i];
    return '';
  }

  function render(focusSel) {
    doll.textContent = '';
    var layout = [null, 'head', null, 'weapon', 'neck', 'shield', 'ring', 'hands', 'boots'];
    layout.forEach(function (key) {
      if (!key) {
        var gap = document.createElement('span');
        gap.className = 'od-spacer';
        gap.setAttribute('aria-hidden', 'true');
        doll.appendChild(gap);
        return;
      }
      var meta = SLOT.filter(function (s) { return s.key === key; })[0];
      var id = equipped[key];
      var it = id ? items[id] : null;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'slot' + (it ? ' r-' + it.rarity : '');
      btn.dataset.where = 'doll';
      btn.dataset.slot = key;
      if (id) btn.dataset.id = id;
      btn.appendChild(glyph(it ? it.icon : meta.icon));
      var nm = document.createElement('span');
      nm.textContent = it ? it.name : '空';
      var sub = document.createElement('span');
      sub.textContent = meta.label + (it ? ' · ' + it.rarity : '');
      btn.appendChild(nm);
      btn.appendChild(sub);
      btn.setAttribute('aria-label', (it ? it.name : '空的') + meta.label + '，点按更换，长按查看');
      doll.appendChild(btn);
    });

    bagEl.textContent = '';
    bag.forEach(function (id) {
      var it = items[id];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell r-' + it.rarity;
      btn.dataset.where = 'bag';
      btn.dataset.id = id;
      btn.appendChild(glyph(it.icon));
      var nm = document.createElement('span');
      nm.textContent = it.name;
      var sub = document.createElement('span');
      sub.textContent = it.rarity;
      btn.appendChild(nm);
      btn.appendChild(sub);
      if (betterThanWorn(it)) {
        var up = document.createElement('span');
        up.className = 'up';
        up.textContent = '更好';
        btn.appendChild(up);
      }
      btn.setAttribute('aria-label', it.name + '，' + it.rarity + (betterThanWorn(it) ? '，比身上的更好' : '') + '。点按装备，长按查看');
      bagEl.appendChild(btn);
    });
    var empty = 60 - bag.length;
    for (var n = 0; n < empty; n++) {
      var hole = document.createElement('div');
      hole.className = 'cell is-empty';
      hole.setAttribute('aria-hidden', 'true');
      var t = document.createElement('span');
      t.textContent = '空';
      hole.appendChild(t);
      bagEl.appendChild(hole);
    }
    document.getElementById('count').textContent = '背包 ' + bag.length + '/60';
    var total = sum();
    var weapon = items[equipped.weapon];
    document.getElementById('sDps').textContent = weapon && weapon.dps ? weapon.dps : '0';
    document.getElementById('sLife').textContent = String(total.life);
    document.getElementById('sSh').textContent = String(total.shield);
    var cut = Math.round(total.armor / (total.armor + 500) * 100);
    document.getElementById('sAr').textContent = total.armor + ' · ' + cut + '%';
    document.getElementById('sEv').textContent = total.dodge + '%';
    if (focusSel) {
      var el = document.querySelector(focusSel);
      if (el) el.focus();
    }
  }

  function openItem(id, trigger) {
    var it = items[id];
    if (!it) return;
    opener = trigger;
    document.getElementById('dName').textContent = it.name;
    document.getElementById('dMeta').textContent = it.rarity + ' · ' + slotLabel(it.slot) + ' · 等级 100';
    document.getElementById('dBlurb').textContent = it.blurb;
    var lines = document.getElementById('dLines');
    var affix = document.getElementById('dAffix');
    lines.textContent = '';
    affix.textContent = '';
    it.lines.forEach(function (line) {
      var li = document.createElement('li');
      li.textContent = line;
      lines.appendChild(li);
    });
    if (!it.affixes.length) {
      var none = document.createElement('li');
      none.textContent = '没有词条';
      affix.appendChild(none);
    }
    it.affixes.forEach(function (pair) {
      var li = document.createElement('li');
      var tier = document.createElement('span');
      tier.className = 'tier';
      tier.textContent = pair[0] + ' ';
      li.appendChild(tier);
      li.appendChild(document.createTextNode(pair[1]));
      affix.appendChild(li);
    });
    sheet.showModal();
    document.getElementById('dClose').focus();
  }

  function slotLabel(key) {
    var found = SLOT.filter(function (s) { return s.key === key; })[0];
    return found ? found.label : key;
  }

  function equip(id, trigger) {
    var it = items[id];
    var prev = equipped[it.slot];
    if (prev === id) {
      live.textContent = it.name + ' 已经在身上';
      return;
    }
    equipped[it.slot] = id;
    var idx = bag.indexOf(id);
    if (prev) bag[idx] = prev;
    else bag.splice(idx, 1);
    live.textContent = '已装备 ' + it.name;
    render('[data-slot="' + it.slot + '"]');
  }

  document.getElementById('board').addEventListener('pointerdown', function (e) {
    var btn = e.target.closest('button[data-id]');
    if (!btn) return;
    longFired = false;
    pressBtn = btn;
    timer = setTimeout(function () {
      longFired = true;
      openItem(btn.dataset.id, btn);
    }, 480);
  });
  function cancelPress() { clearTimeout(timer); }
  document.getElementById('board').addEventListener('pointerup', cancelPress);
  document.getElementById('board').addEventListener('pointercancel', cancelPress);
  document.getElementById('board').addEventListener('pointermove', function (e) {
    if (!pressBtn || !timer) return;
    if (e.target.closest('button') !== pressBtn) cancelPress();
  });
  document.getElementById('board').addEventListener('contextmenu', function (e) {
    var btn = e.target.closest('button[data-id]');
    if (!btn) return;
    e.preventDefault();
    longFired = true;
    cancelPress();
    openItem(btn.dataset.id, btn);
  });
  document.getElementById('board').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-id]');
    if (!btn) return;
    if (longFired) { longFired = false; return; }
    if (btn.dataset.where === 'bag') equip(btn.dataset.id, btn);
  });

  document.getElementById('dClose').addEventListener('click', function () { sheet.close(); });
  sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.close(); });
  sheet.addEventListener('close', function () {
    if (opener && opener.isConnected) opener.focus();
  });

  document.getElementById('sortBtn').addEventListener('click', function () {
    bag.sort(function (a, b) {
      var A = items[a], B = items[b];
      return (order[B.rarity] - order[A.rarity]) || A.name.localeCompare(B.name, 'zh');
    });
    live.textContent = '已按稀有度整理';
    render('#sortBtn');
  });

  document.getElementById('junkBtn').addEventListener('click', function () {
    var commons = bag.filter(function (id) { return items[id].rarity === '普通'; });
    if (!commons.length) {
      live.textContent = '背包里没有普通装备';
      return;
    }
    opener = document.getElementById('junkBtn');
    document.getElementById('askTitle').textContent = '拆解普通装备';
    document.getElementById('askBody').textContent = '将拆掉背包中的 ' + commons.length + ' 件普通装备，此操作只影响这页示例。';
    document.getElementById('askYes').textContent = '拆解';
    ask.showModal();
    document.getElementById('askNo').focus();
  });
  document.getElementById('askNo').addEventListener('click', function () { ask.close(); });
  document.getElementById('askYes').addEventListener('click', function () {
    var before = bag.length;
    bag = bag.filter(function (id) { return items[id].rarity !== '普通'; });
    var removed = before - bag.length;
    ask.close();
    live.textContent = '已拆解 ' + removed + ' 件普通装备';
    render('#junkBtn');
  });
  ask.addEventListener('close', function () {
    if (opener && opener.isConnected) opener.focus();
  });
  ask.addEventListener('click', function (e) { if (e.target === ask) ask.close(); });

  render(null);
})();
</script>
</body>
</html>
