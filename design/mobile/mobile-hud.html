<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灰烬地穴 · 局内</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

:root {
  --bg: #2a2433;
  --bg-deep: #14111c;
  --gold: #c8913a;
  --ember: #ff9a3c;
  --blood: #c0282d;
  --mana: #6a4ad0;
  --ink: #f4ead8;
  --muted: #d2c3b0;
  --font: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html { background: #120e16; }
body {
  width: 390px;
  height: 844px;
  margin: 0 auto;
  overflow: hidden;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink);
  background: #141824;
}
button, a { font: inherit; }
button { cursor: pointer; }
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.od-icon { image-rendering: pixelated; shape-rendering: crispEdges; }
.screen {
  width: 390px;
  height: 844px;
  display: grid;
  grid-template-rows: 54px auto auto minmax(0, 1fr) auto 34px;
  position: relative;
  background-color: #141824;
  background-image:
    linear-gradient(rgba(196, 214, 255, 0.05) 2px, transparent 2px),
    linear-gradient(90deg, rgba(196, 214, 255, 0.05) 2px, transparent 2px);
  background-size: 26px 18px;
}
.top, .boss, .hands { padding-inline: 12px; }
.top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.plaque {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  justify-items: center;
  padding: 4px 12px;
  background: #3a2a18;
  border: 2px solid var(--gold);
  color: #f6e2a8;
}
.plaque b, .plaque span { display: block; }
.plaque b { font-size: 18px; font-weight: 700; line-height: 1.3; letter-spacing: 0.02em; }
.plaque span { font-size: 16px; line-height: 1.3; color: var(--ink); }
.icon-btn, .text-btn, .skills button, .stick {
  border: 2px solid var(--gold);
  background: #241c2c;
  color: var(--ink);
  min-width: 44px;
  min-height: 44px;
}
.icon-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 64px;
  min-height: 52px;
  text-decoration: none;
  gap: 0;
}
.icon-btn span, .text-btn span, .skills button span { display: block; }
.icon-btn span { font-size: 16px; line-height: 1.2; }
.text-btn {
  min-height: 44px;
  padding: 8px 12px;
  color: var(--ink);
}
.boss { padding-bottom: 4px; }
.boss-count {
  margin: 0;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
}
.boss-row { display: flex; align-items: center; gap: 8px; }
.bar {
  flex: 1 1 auto;
  height: 14px;
  border: 2px solid var(--gold);
  background: #1a1422;
}
.bar-fill { height: 100%; width: 0; background: var(--ember); }
.play {
  position: relative;
  min-height: 0;
  display: grid;
  place-items: center;
}
.ring {
  width: 168px;
  height: 168px;
  border: 8px solid rgba(255, 154, 60, 0.85);
  border-radius: 50%;
  box-shadow: inset 0 0 0 6px rgba(106, 74, 208, 0.35);
  display: grid;
  place-items: center;
}
.core {
  width: 22px;
  height: 22px;
  background: #fff6ea;
  box-shadow: 0 0 0 4px rgba(255, 154, 60, 0.7);
}
.float-dmg {
  position: absolute;
  top: 38%;
  left: 46%;
  margin: 0;
  color: #ffe08a;
  font-weight: 700;
  text-shadow: 0 1px 0 #1a1208;
}
.mote {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--ember);
  opacity: 0.9;
  animation: rise 2.4s var(--ease) infinite;
}
.mote:nth-child(1) { left: 18%; bottom: 20%; animation-delay: 0s; }
.mote:nth-child(2) { left: 70%; bottom: 28%; animation-delay: 0.4s; }
.mote:nth-child(3) { left: 40%; bottom: 12%; animation-delay: 0.8s; }
.mote:nth-child(4) { left: 82%; bottom: 40%; animation-delay: 1.1s; }
.mote:nth-child(5) { left: 28%; bottom: 46%; animation-delay: 1.5s; }
@keyframes rise {
  from { transform: translateY(0); opacity: 0.95; }
  to { transform: translateY(-72px); opacity: 0; }
}
.zones {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 38px;
  height: 292px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}
.zone {
  width: 46%;
  background: rgba(255, 154, 60, 0.14);
  border: 2px dashed rgba(255, 154, 60, 0.7);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 6px;
  color: #ffe0bf;
  font-size: 16px;
}
.hands {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding-bottom: 8px;
  align-items: end;
}
.screen.hand-left .hands { direction: rtl; }
.screen.hand-left .hands > * { direction: ltr; }
.screen.hand-left .zones { flex-direction: row-reverse; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stick-slot {
  min-height: 128px;
  display: grid;
  place-items: center;
}
.stick {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  position: relative;
  touch-action: none;
  background: rgba(36, 28, 44, 0.88);
}
.knob {
  width: 48px;
  height: 48px;
  border: 2px solid var(--ember);
  background: #4a3b2a;
  border-radius: 50%;
  position: absolute;
  left: 36px;
  top: 36px;
}
 .stick-slot.float { position: relative; min-height: 196px; display: block; border: 2px dashed rgba(255,154,60,0.45); background: rgba(255,154,60,0.06); touch-action: none; }
.float-hint { margin: 0; padding: 6px 8px 0; font-size: 13px; line-height: 1.35; color: #e9d8c0; }
.stick-slot.float .stick { position: absolute; border: 2px solid rgba(255,154,60,0.8); }
.stick-slot.float.idle .stick { opacity: 0.35; }
.touch-dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: #fff3d6; opacity: 0.8; pointer-events: none; }
.stick.is-back .knob { transition: left 150ms var(--ease), top 150ms var(--ease); }
.auto-banner {
  margin: 0;
  min-height: 120px;
  display: grid;
  place-items: center;
  border: 2px solid var(--ember);
  background: rgba(255, 154, 60, 0.16);
  color: #ffe7c8;
  font-weight: 700;
  text-align: center;
  padding: 8px;
}
.orb-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.orb {
  width: 72px;
  height: 72px;
  flex: none;
  border-radius: 50%;
  border: 2px solid var(--gold);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.15;
}
.orb b, .orb span { display: block; }
.orb-hp { background: radial-gradient(circle at 40% 35%, #e24b48, #8f1c22 70%); }
.orb-mp { background: radial-gradient(circle at 40% 35%, #8d6cf0, #3d2878 72%); }
.orb b { font-size: 18px; color: #fff6ea; }
.orb span { font-size: 16px; color: #fff6ea; }
.def-tag {
  margin: 0;
  padding: 6px 8px;
  border: 2px solid var(--gold);
  background: #241c2c;
  color: var(--ink);
  font-weight: 700;
}
.skills {
  display: grid;
  grid-template-columns: 64px 64px;
  gap: 8px;
  justify-content: end;
}
.skills button {
  width: 64px;
  height: 64px;
  padding: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
.skills button span { font-size: 16px; line-height: 1.1; }
.skills button.is-cd {
  background: #1a1422;
  color: var(--ember);
  border-color: var(--ember);
}
.mana-wrap { display: flex; justify-content: flex-end; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
@media (hover: hover) {
  .icon-btn:hover, .text-btn:hover, .skills button:hover:not(.is-cd) {
    border-color: var(--ember);
    background: #3a3148;
  }
}
@media (prefers-reduced-motion: reduce) {
  .mote { animation: none; }
  .stick.is-back .knob { transition: none; }
}
.ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ctl .text-btn { min-height: 44px; display: grid; place-items: center; text-decoration: none; }
.ctl .ret { color: #e8a25a; border-color: #8a4a2a; }
.ctl .ret.confirm { background: #6a1e1a; color: #ffd9c0; }
.ctl .main { grid-column: span 2; background: #c8913a; color: #1a1208; font-weight: 700; }
</style>
</head>
<body>
<h1 class="vh">灰烬地穴 局内 · 第 61 层 霜冻王座</h1>
<div class="screen" id="screen">
  <div class="safe"></div>
  <header class="top">
    <div class="plaque">
      <b>第 61 层 · 霜冻王座</b>
      <span>Boss 进度</span>
    </div>
    <button type="button" class="text-btn" id="zoneToggle" aria-pressed="true">热区</button>
    <a class="icon-btn" href="mobile-settings.html">
      <svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:18px">
        <rect x="6" y="1" width="4" height="3" fill="currentColor"/>
        <rect x="6" y="12" width="4" height="3" fill="currentColor"/>
        <rect x="1" y="6" width="3" height="4" fill="currentColor"/>
        <rect x="12" y="6" width="3" height="4" fill="currentColor"/>
        <rect x="5" y="5" width="6" height="6" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>设置</span>
    </a>
  </header>
  <div class="boss">
    <p class="boss-count od-nowrap">0 / 152</p>
    <div class="boss-row">
      <svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:22px">
        <rect x="3" y="2" width="10" height="8" fill="#f4ead8"/>
        <rect x="4" y="5" width="2" height="2" fill="#14111c"/>
        <rect x="10" y="5" width="2" height="2" fill="#14111c"/>
        <rect x="6" y="10" width="4" height="2" fill="#f4ead8"/>
        <rect x="4" y="12" width="2" height="2" fill="#f4ead8"/>
        <rect x="10" y="12" width="2" height="2" fill="#f4ead8"/>
      </svg>
      <div class="bar" role="meter" aria-valuenow="0" aria-valuemin="0" aria-valuemax="152" aria-label="Boss 进度 0 / 152">
        <div class="bar-fill"></div>
      </div>
      <svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:22px">
        <rect x="3" y="2" width="10" height="8" fill="#f4ead8"/>
        <rect x="4" y="5" width="2" height="2" fill="#14111c"/>
        <rect x="10" y="5" width="2" height="2" fill="#14111c"/>
        <rect x="6" y="10" width="4" height="2" fill="#f4ead8"/>
        <rect x="4" y="12" width="2" height="2" fill="#f4ead8"/>
        <rect x="10" y="12" width="2" height="2" fill="#f4ead8"/>
      </svg>
    </div>
  </div>
  <div class="play" aria-hidden="true">
    <span class="mote"></span>
    <span class="mote"></span>
    <span class="mote"></span>
    <span class="mote"></span>
    <span class="mote"></span>
    <div class="ring"><div class="core"></div></div>
    <p class="float-dmg od-nowrap">3.26K</p>
  </div>
  <div class="hands" id="hands">
    <div class="col">
      <div class="stick-slot float" id="stickZone">
        <p class="float-hint">左下任意处按下 → 摇杆出现在拇指下；松手几秒后回到自动</p>
        <div class="stick" id="stick" role="slider" aria-label="浮动虚拟摇杆" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="居中" tabindex="0" style="left:30px;top:66px">
          <div class="knob" id="knob"></div>
        </div>
        <span class="touch-dot" id="touchDot" style="left:90px;top:126px"></span>
      </div>
      <div class="orb-row">
        <div class="orb orb-hp" aria-label="生命 435，护盾加 243">
          <b class="od-nowrap">435</b>
          <span class="od-nowrap">+243</span>
        </div>
        <p class="def-tag od-nowrap">贴 −24%</p>
      </div>
    </div>
    <div class="col">
      <div class="ctl" id="ctl">
        <button type="button" class="text-btn" id="aiBtn" aria-pressed="true">自动</button>
        <button type="button" class="text-btn" id="lockBtn" aria-pressed="false">推层</button>
        <button type="button" class="text-btn main" id="mainBtn">继续</button>
        <button type="button" class="text-btn ret" id="retBtn" aria-label="提前返回营地（需再点一次确认）">返回</button>
        <a class="text-btn" href="mobile-gear.html">菜单</a>
      </div>
      <div class="mana-wrap">
        <div class="orb orb-mp" aria-label="灯火 93%，每秒 −7.8">
          <b class="od-nowrap">93%</b>
          <span class="od-nowrap">−7.8/秒</span>
        </div>
      </div>
    </div>
  </div>
  <div class="safe"></div>
  <div class="zones" id="zones">
    <div class="zone"></div>
    <div class="zone">右手热区</div>
  </div>
</div>
<p class="vh" id="live" aria-live="polite"></p>
<script>
(function () {
  var screen = document.getElementById('screen');
  var stick = document.getElementById('stick');
  var knob = document.getElementById('knob');
      var zoneToggle = document.getElementById('zoneToggle');
  var zones = document.getElementById('zones');
  var live = document.getElementById('live');
  var timers = new WeakMap();

  try {
    if (localStorage.getItem('ashen-crypt-hand') === 'left') screen.classList.add('hand-left');
  } catch (err) { /* 存储不可用时保持右手 */ }

  zoneToggle.addEventListener('click', function () {
    var on = zoneToggle.getAttribute('aria-pressed') === 'true';
    zoneToggle.setAttribute('aria-pressed', on ? 'false' : 'true');
    zones.hidden = on;
    live.textContent = on ? '已隐藏拇指热区' : '已显示拇指热区';
  });

  var zone = document.getElementById('stickZone');
  var dot = document.getElementById('touchDot');
  /* 浮动摇杆：在左下热区任意处按下，摇杆中心跳到按下点；松手后淡出留在原处 */
  zone.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.stick')) return;
    var r = zone.getBoundingClientRect();
    var x = Math.max(60, Math.min(r.width - 60, e.clientX - r.left));
    var y = Math.max(60, Math.min(r.height - 60, e.clientY - r.top));
    stick.style.left = (x - 60) + 'px'; stick.style.top = (y - 60) + 'px';
    dot.style.left = x + 'px'; dot.style.top = y + 'px';
    zone.classList.remove('idle');
    live.textContent = '摇杆出现在拇指位置';
  });
  var dragging = false;
  var center = 36;
  var maxR = 32;

  function setKnob(dx, dy, text) {
    var len = Math.hypot(dx, dy);
    if (len > maxR) {
      dx = dx / len * maxR;
      dy = dy / len * maxR;
    }
    knob.style.left = (center + dx) + 'px';
    knob.style.top = (center + dy) + 'px';
    stick.setAttribute('aria-valuenow', String(Math.round(len / maxR * 100)));
    stick.setAttribute('aria-valuetext', text || '偏移');
  }

  stick.addEventListener('pointerdown', function (e) {
    
    dragging = true;
    stick.classList.remove('is-back');
    stick.setPointerCapture(e.pointerId);
    moveStick(e);
  });
  stick.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    moveStick(e);
  });
  function endStick() {
    if (!dragging) return;
    dragging = false;
    stick.classList.add('is-back');
    setKnob(0, 0, '居中');
  }
  stick.addEventListener('pointerup', endStick);
  stick.addEventListener('pointercancel', endStick);

  function moveStick(e) {
    var rect = stick.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    setKnob(e.clientX - cx, e.clientY - cy, '拖动中');
  }

  stick.addEventListener('keydown', function (e) {
    var map = { ArrowLeft: [-20, 0, '向左'], ArrowRight: [20, 0, '向右'], ArrowUp: [0, -20, '向上'], ArrowDown: [0, 20, '向下'] };
    if (!map[e.key]) return;
    e.preventDefault();
    stick.classList.remove('is-back');
    setKnob(map[e.key][0], map[e.key][1], map[e.key][2]);
    setTimeout(function () {
      stick.classList.add('is-back');
      setKnob(0, 0, '居中');
    }, 180);
  });

  /* 与桌面版底栏一致：自动/手动、推层/锁层、开始/继续/暂停；没有主动技能，攻击全自动 */
  var ai = document.getElementById('aiBtn'), lock = document.getElementById('lockBtn'), mainB = document.getElementById('mainBtn');
  ai.addEventListener('click', function () { var on = ai.getAttribute('aria-pressed') !== 'true'; ai.setAttribute('aria-pressed', String(on)); ai.textContent = on ? '自动' : '手动'; });
  lock.addEventListener('click', function () { var on = lock.getAttribute('aria-pressed') !== 'true'; lock.setAttribute('aria-pressed', String(on)); lock.textContent = on ? '锁层' : '推层'; });
  mainB.addEventListener('click', function () { mainB.textContent = mainB.textContent === '暂停' ? '继续' : '暂停'; });
})();
</script>
<script>
(function(){var b=document.getElementById('retBtn'),t;if(!b)return;b.addEventListener('click',function(){if(b.classList.contains('confirm')){b.classList.remove('confirm');b.textContent='返回';alert('提前返回：结束这一趟回营地');return;}b.classList.add('confirm');b.textContent='确认返回?';clearTimeout(t);t=setTimeout(function(){b.classList.remove('confirm');b.textContent='返回';},3000);});})();
</script>
</body>
