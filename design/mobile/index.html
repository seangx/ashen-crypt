<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灰烬地穴 · 竖屏界面</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-field,.od-stat) > :where(*) { min-width: 0; }
  .od-stack { display: flex; flex-direction: column; gap: 8px; }
  .od-row { display: flex; align-items: center; gap: 8px; }
  .od-field, .od-stat { display: grid; gap: 2px; }
  :where(.od-field,.od-stat) > :where(*) { display: block; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-nowrap { white-space: nowrap; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */
:root {
  --bg: #2a2433; --gold: #c8913a; --ember: #ff9a3c; --ink: #f4ead8; --muted: #d2c3b0;
  --font: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
html { background: #120e16; }
body {
  margin: 0;
  min-height: 100vh;
  background: #120e16;
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
}
header { padding: 28px 24px 8px; max-width: 72rem; }
h1 { margin: 0; font-size: 32px; line-height: 1.3; color: #f6e2a8; }
header p { margin: 8px 0 0; max-width: 40rem; color: var(--muted); }
.board {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 16px 24px 32px;
  align-items: flex-start;
}
.card { position: relative; width: 214px; flex: none; }
.frame {
  width: 214px;
  height: 464px;
  overflow: hidden;
  border: 2px solid var(--gold);
  background: var(--bg);
}
.frame iframe {
  width: 390px;
  height: 844px;
  border: 0;
  transform: scale(0.5487);
  transform-origin: top left;
  pointer-events: none;
}
.card h2 { margin: 8px 0 0; font-size: 18px; }
.card h2 a { color: var(--ink); text-decoration: none; }
.card h2 a::after { content: ""; position: absolute; inset: 0; }
.card p { margin: 4px 0 0; color: var(--muted); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
@media (hover: hover) {
  .card:hover .frame { border-color: var(--ember); }
  .card h2 a:hover { color: #fff6ea; }
}
</style>
</head>
<body>
<header>
  <h1>灰烬地穴 · 竖屏</h1>
  <p>七张界面都是 390×844 的独立页面。点缩略图进入全尺寸。战场、血球和词条都取自现有横屏界面，画面是示意。</p>
</header>
<div class="board">
  <article class="card">
    <div class="frame"><iframe src="mobile-hud.html" title="局内界面预览" tabindex="-1"></iframe></div>
    <h2><a href="mobile-hud.html">局内</a></h2>
    <p>血球和灯笼收进角落，四键在右手拇指区，可改自动移动。</p>
  </article>
  <article class="card">
    <div class="frame"><iframe src="mobile-gear.html" title="装备界面预览" tabindex="-1"></iframe></div>
    <h2><a href="mobile-gear.html">装备</a></h2>
    <p>纸娃娃加背包。长按物品拉出词条，骨弓这类会标「更好」。</p>
  </article>
  <article class="card">
    <div class="frame"><iframe src="mobile-tree.html" title="天赋界面预览" tabindex="-1"></iframe></div>
    <h2><a href="mobile-tree.html">天赋</a></h2>
    <p>星图可单指拖动、双指缩放。点节点后在底部点亮。</p>
  </article>
  <article class="card">
    <div class="frame"><iframe src="mobile-forge.html" title="铁砧界面预览" tabindex="-1"></iframe></div>
    <h2><a href="mobile-forge.html">铁砧</a></h2>
    <p>选物品和词条，再升档、洗数值或立誓。立誓前会确认。</p>
  </article>
  <article class="card">
    <div class="frame"><iframe src="mobile-runes.html" title="符文界面预览" tabindex="-1"></iframe></div>
    <h2><a href="mobile-runes.html">符文</a></h2>
    <p>点选或拖进槽位。低于 15 级会标红，表示在此不生效。</p>
  </article>
  <article class="card">
    <div class="frame"><iframe src="mobile-ladder.html" title="阶梯界面预览" tabindex="-1"></iframe></div>
    <h2><a href="mobile-ladder.html">阶梯</a></h2>
    <p>层数卡片可滚动。选中后按开始，未解锁的层不能进。</p>
  </article>
  <article class="card">
    <div class="frame"><iframe src="mobile-settings.html" title="设置界面预览" tabindex="-1"></iframe></div>
    <h2><a href="mobile-settings.html">设置</a></h2>
    <p>音量、画质、震屏、伤害数字、自动拾取、左右手和语言。</p>
  </article>
</div>
</body>
</html>
