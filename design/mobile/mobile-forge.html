<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灰烬地穴 · 铁砧</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill { flex: 1 1 0; min-width: 0; }
  .od-fixed { flex: none; }
  .od-grid { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap { white-space: nowrap; }
  .od-keep { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding-inline: 12px; scroll-padding-inline: 12px; }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: 12px; }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */
:root {
  --bg: #2a2433; --gold: #c8913a; --ember: #ff9a3c; --ink: #f4ead8; --muted: #d2c3b0;
  --font: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html { background: #120e16; }
body { width: 390px; height: 844px; margin: 0 auto; overflow: hidden; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--bg); }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.od-icon { image-rendering: pixelated; shape-rendering: crispEdges; }
.app { height: 844px; display: grid; grid-template-rows: 54px auto minmax(0, 1fr) auto auto auto 34px; }
.head { display: flex; justify-content: center; align-items: flex-end; padding-bottom: 8px; }
.plaque { text-align: center; padding: 4px 18px; background: #3a2a18; border: 2px solid var(--gold); color: #f6e2a8; }
.plaque b, .plaque span { display: block; line-height: 1.3; }
.plaque b { font-size: 18px; }
.plaque span { color: var(--ink); }
.pick { min-width: 108px; min-height: 64px; padding: 8px; border: 2px solid #6a5433; background: #241c2e; color: var(--ink); text-align: left; }
.pick span, .affix span { display: block; }
.pick[aria-pressed="true"] { border-color: var(--ember); background: #4a3218; }
.summary { padding: 12px 12px 4px; }
.summary h2 { margin: 0; font-size: 22px; }
.summary p { margin: 0; color: var(--muted); }
.affixes { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px 12px; }
.affix { min-height: 56px; text-align: left; padding: 8px 10px; border: 2px solid var(--gold); background: #241c2e; color: var(--ink); }
.affix[aria-pressed="true"] { border-color: var(--ember); background: #3a2a22; }
.affix .tier { color: #f0d78c; font-weight: 700; }
.affix.is-lock { border-style: dashed; }
.empty { margin: 12px; color: var(--muted); }
.status { margin: 0; padding: 0 12px 8px; min-height: 1.5em; color: #f6e2a8; }
.ops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 8px; }
.ops button { min-height: 48px; border: 2px solid var(--gold); background: #241c2e; color: var(--ink); }
.ops button.wide { grid-column: 1 / -1; background: var(--ember); color: #1a1208; border-color: #ffc27a; font-weight: 700; }
.ops button:disabled { background: #3a3344; color: #d9cbb8; border-color: #6a5a48; }
.nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #1a1522; border-top: 2px solid var(--gold); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; text-decoration: none; color: var(--muted); }
.nav a span { display: block; line-height: 1.2; }
.nav a[aria-current="page"] { color: var(--ember); box-shadow: inset 0 -3px 0 var(--ember); }
dialog.sheet { width: min(390px, 100vw); margin: auto auto 0; border: 2px solid var(--gold); background: #322838; color: var(--ink); padding: 16px 16px 28px; }
dialog.sheet::backdrop { background: rgba(10, 8, 14, 0.72); }
dialog.sheet[open] { animation: sheet-in 200ms var(--ease); }
@keyframes sheet-in { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
dialog.sheet h2 { margin: 0; font-size: 20px; }
dialog.sheet p { margin: 0; }
.dlg-actions { display: flex; gap: 8px; }
.dlg-actions button { flex: 1 1 0; min-height: 48px; border: 2px solid var(--gold); background: #241c2e; color: var(--ink); }
#askYes { background: var(--ember); color: #1a1208; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
@media (hover: hover) {
  .pick:hover, .affix:hover, .ops button:hover:not(:disabled), .nav a:hover { border-color: var(--ember); }
  .nav a:hover { color: var(--ink); }
}
@media (prefers-reduced-motion: reduce) { dialog.sheet[open] { animation: none; } }
</style>
</head>
<body>
<h1 class="vh">铁砧</h1>
<div class="app">
  <div></div>
  <header class="head">
    <div class="plaque"><b>铁砧</b><span>先选物品，再点词条</span></div>
  </header>
  <main class="od-scroll" id="main">
    <div class="od-rail" id="rail" aria-label="背包物品"></div>
    <div class="summary" id="summary"></div>
    <div class="affixes" id="affixes"></div>
    <p class="empty" id="empty" hidden>这条装备没有词条。</p>
    <p class="empty" id="noitem" hidden>没有可锻造的装备。</p>
  </main>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="ops">
    <button type="button" data-act="up">升一档</button>
    <button type="button" data-act="roll">洗数值</button>
    <button type="button" data-act="del">移除</button>
    <button type="button" data-act="junk">拆解</button>
    <button type="button" data-act="vow" class="wide" id="vowBtn">立誓 ×6</button>
  </div>
  <nav class="nav" aria-label="主菜单">
    <a href="mobile-gear.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="7" y="1" width="2" height="9" fill="currentColor"/><rect x="4" y="8" width="8" height="2" fill="currentColor"/><rect x="7" y="11" width="2" height="4" fill="currentColor"/></svg><span>装备</span></a>
    <a href="mobile-tree.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="7" y="7" width="2" height="2" fill="currentColor"/><rect x="7" y="1" width="2" height="4" fill="currentColor"/><rect x="7" y="11" width="2" height="4" fill="currentColor"/><rect x="1" y="7" width="4" height="2" fill="currentColor"/><rect x="11" y="7" width="4" height="2" fill="currentColor"/></svg><span>天赋</span></a>
    <a href="mobile-forge.html" aria-current="page"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="2" y="10" width="12" height="4" fill="currentColor"/><rect x="4" y="6" width="8" height="4" fill="currentColor"/><rect x="7" y="2" width="2" height="4" fill="currentColor"/></svg><span>铁砧</span></a>
    <a href="mobile-runes.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="6" y="1" width="4" height="4" fill="currentColor"/><rect x="3" y="6" width="4" height="4" fill="currentColor"/><rect x="9" y="6" width="4" height="4" fill="currentColor"/><rect x="6" y="11" width="4" height="4" fill="currentColor"/></svg><span>符文</span></a>
    <a href="mobile-ladder.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="3" y="2" width="2" height="12" fill="currentColor"/><rect x="11" y="2" width="2" height="12" fill="currentColor"/><rect x="5" y="4" width="6" height="2" fill="currentColor"/><rect x="5" y="8" width="6" height="2" fill="currentColor"/><rect x="5" y="12" width="6" height="2" fill="currentColor"/></svg><span>阶梯</span></a>
  </nav>
  <div></div>
</div>
<dialog class="sheet" id="ask">
  <form class="od-stack">
    <h2 id="askTitle">确认</h2>
    <p id="askBody"></p>
    <div class="dlg-actions">
      <button type="button" id="askNo">取消</button>
      <button type="button" id="askYes">确认</button>
    </div>
  </form>
</dialog>
<script>
(function () {
  var items = [
    { id: 'blade', name: '回旋骨刃', meta: '稀有 · 武器 · 等级 100 · 永恒', vows: 6, affixes: [
      { id: 'a1', tier: 7, text: '物理基础伤害提高 96%', locked: false },
      { id: 'a2', tier: 7, text: '附加 42–98 物理伤害', locked: false },
      { id: 'a3', tier: 7, text: '基础攻速提高 39%', locked: false },
      { id: 'a4', tier: 5, text: '【持续施放】叠层上限 +5', locked: false }
    ]},
    { id: 'crown', name: '霜冠', meta: '魔法 · 头 · 等级 100', vows: 6, affixes: [
      { id: 'c1', tier: 3, text: '冰缓抗性提高 18%', locked: false },
      { id: 'c2', tier: 4, text: '生命提高 12%', locked: false }
    ]},
    { id: 'ring', name: '余烬戒', meta: '稀有 · 戒 · 等级 100', vows: 6, affixes: [
      { id: 'r1', tier: 4, text: '火焰伤害提高 12%', locked: false },
      { id: 'r2', tier: 5, text: '暴击率提高 4%', locked: false }
    ]}
  ];
  var current = 0;
  var selected = 'a1';
  var pending = null;
  var opener = null;
  var ask = document.getElementById('ask');
  var status = document.getElementById('status');

  function item() { return items[current] || null; }
  function affix() {
    var it = item();
    if (!it) return null;
    return it.affixes.filter(function (a) { return a.id === selected; })[0] || null;
  }
  function say(text) { status.textContent = text; }

  function render(focus) {
    var rail = document.getElementById('rail');
    var summary = document.getElementById('summary');
    var list = document.getElementById('affixes');
    rail.textContent = '';
    summary.textContent = '';
    list.textContent = '';
    var it = item();
    document.getElementById('noitem').hidden = !!it;
    document.getElementById('empty').hidden = !it || it.affixes.length > 0;
    items.forEach(function (entry, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pick';
      btn.dataset.index = String(index);
      btn.setAttribute('aria-pressed', index === current ? 'true' : 'false');
      var name = document.createElement('span');
      name.textContent = entry.name;
      var meta = document.createElement('span');
      meta.textContent = '词条 ' + entry.affixes.length;
      btn.appendChild(name);
      btn.appendChild(meta);
      rail.appendChild(btn);
    });
    var vowBtn = document.getElementById('vowBtn');
    if (!it) {
      vowBtn.textContent = '立誓 ×0';
      vowBtn.disabled = true;
      if (focus) { var fb = document.querySelector(focus); if (fb) fb.focus(); }
      return;
    }
    var h = document.createElement('h2');
    h.textContent = it.name;
    var p = document.createElement('p');
    p.textContent = it.meta + ' · 立誓剩余 ' + it.vows;
    summary.appendChild(h);
    summary.appendChild(p);
    it.affixes.forEach(function (a) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'affix' + (a.locked ? ' is-lock' : '');
      btn.dataset.affix = a.id;
      btn.setAttribute('aria-pressed', a.id === selected ? 'true' : 'false');
      var tier = document.createElement('span');
      tier.className = 'tier';
      tier.textContent = 'T' + a.tier + (a.locked ? ' · 已立誓' : '');
      var text = document.createElement('span');
      text.textContent = a.text;
      btn.appendChild(tier);
      btn.appendChild(text);
      list.appendChild(btn);
    });
    vowBtn.textContent = '立誓 ×' + it.vows;
    vowBtn.disabled = it.vows <= 0;
    if (focus) {
      var el = document.querySelector(focus);
      if (el) el.focus();
    }
  }

  function needAffix() {
    if (!item()) { say('没有可锻造的装备'); return false; }
    if (!affix()) { say('先点一条词条'); return false; }
    return true;
  }

  document.getElementById('rail').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    current = Number(btn.dataset.index);
    var it = item();
    selected = it && it.affixes[0] ? it.affixes[0].id : null;
    say('已选择 ' + it.name);
    render('[data-index="' + current + '"]');
  });
  document.getElementById('affixes').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    selected = btn.dataset.affix;
    render('[data-affix="' + selected + '"]');
  });

  document.querySelector('.ops').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    var act = btn.dataset.act;
    var it = item();
    var a = affix();
    if (act === 'junk') {
      if (!it) { say('没有可锻造的装备'); return; }
      opener = btn;
      pending = 'junk';
      document.getElementById('askTitle').textContent = '拆解 ' + it.name;
      document.getElementById('askBody').textContent = '拆解后这件装备会从铁砧列表消失。';
      document.getElementById('askYes').textContent = '确认拆解';
      ask.showModal();
      document.getElementById('askNo').focus();
      return;
    }
    if (!needAffix()) return;
    if (a.locked && act !== 'vow') { say('这条词条已立誓，不能再改'); return; }
    if (act === 'up') {
      if (a.tier >= 8) { say('已是最高档'); return; }
      a.tier += 1;
      say('已升到 T' + a.tier);
      render('[data-affix="' + a.id + '"]');
      return;
    }
    if (act === 'roll') {
      a.text = a.text.replace(/\d+(\.\d+)?/, function () { return String(20 + Math.floor(Math.random() * 70)); });
      say('已洗数值');
      render('[data-affix="' + a.id + '"]');
      return;
    }
    if (act === 'del') {
      opener = btn;
      pending = 'del';
      document.getElementById('askTitle').textContent = '移除词条';
      document.getElementById('askBody').textContent = '移除「' + a.text + '」。';
      document.getElementById('askYes').textContent = '确认移除';
      ask.showModal();
      document.getElementById('askNo').focus();
      return;
    }
    if (act === 'vow') {
      if (a.locked) { say('这条已经立誓'); return; }
      if (it.vows <= 0) { say('立誓次数已用完'); return; }
      opener = btn;
      pending = 'vow';
      document.getElementById('askTitle').textContent = '确认立誓';
      document.getElementById('askBody').textContent = '锁定「' + a.text + '」。锁定后不能再洗或移除。剩余立誓 ' + it.vows + ' 次。';
      document.getElementById('askYes').textContent = '确认立誓';
      ask.showModal();
      document.getElementById('askNo').focus();
    }
  });

  document.getElementById('askNo').addEventListener('click', function () { pending = null; ask.close(); });
  ask.addEventListener('click', function (e) { if (e.target === ask) { pending = null; ask.close(); } });
  document.getElementById('askYes').addEventListener('click', function () {
    var it = item();
    var a = affix();
    var act = pending;
    pending = null;
    if (act === 'vow' && it && a && !a.locked && it.vows > 0) {
      a.locked = true;
      it.vows -= 1;
      say('已立誓，剩余 ' + it.vows + ' 次');
    } else if (act === 'del' && it && a) {
      it.affixes = it.affixes.filter(function (x) { return x.id !== a.id; });
      selected = it.affixes[0] ? it.affixes[0].id : null;
      say('已移除词条');
    } else if (act === 'junk' && it) {
      var name = it.name;
      items.splice(current, 1);
      current = Math.max(0, Math.min(current, items.length - 1));
      var next = item();
      selected = next && next.affixes[0] ? next.affixes[0].id : null;
      say('已拆解 ' + name);
    }
    ask.close();
    render(items.length ? '[data-index="' + current + '"]' : '#vowBtn');
  });
  ask.addEventListener('close', function () {
    if (opener && opener.isConnected) opener.focus();
  });

  render(null);
})();
</script>
</body>
</html>
