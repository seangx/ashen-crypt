<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灰烬地穴 · 阶梯</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill { flex: 1 1 0; min-width: 0; }
  .od-fixed { flex: none; }
  .od-grid { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap { white-space: nowrap; }
  .od-keep { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scrollbar-width: none; }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */
:root {
  --bg: #2a2433; --gold: #c8913a; --ember: #ff9a3c; --ink: #f4ead8; --muted: #d2c3b0;
  --font: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html { background: #120e16; }
body { width: 390px; height: 844px; margin: 0 auto; overflow: hidden; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--bg); }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
a.btn { text-decoration: none; }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.od-icon { image-rendering: pixelated; shape-rendering: crispEdges; }
.app { height: 844px; display: grid; grid-template-rows: 54px auto minmax(0, 1fr) auto auto 34px; }
.head { display: flex; justify-content: center; align-items: flex-end; padding-bottom: 8px; }
.plaque { text-align: center; padding: 4px 18px; background: #3a2a18; border: 2px solid var(--gold); color: #f6e2a8; }
.plaque b, .plaque span { display: block; line-height: 1.3; }
.plaque b { font-size: 18px; }
.plaque span { color: var(--ink); }
.rank { margin: 0 12px 8px; padding: 8px 10px; border: 2px solid var(--gold); background: #241c2e; }
.rank b, .rank span { display: block; }
.list { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
.floor { min-height: 76px; text-align: left; padding: 8px 10px; border: 2px solid #6a5433; background: #241c2e; color: var(--ink); }
.floor[aria-pressed="true"] { border-color: var(--ember); background: #3a2a22; }
.floor:disabled { color: #d9cbb8; background: #1a1522; }
.floor span { display: block; }
.time { color: #f6e2a8; }
.lock { color: #ffb4ae; }
.startbar { padding: 0 12px 8px; }
.startbar button { width: 100%; min-height: 48px; border: 2px solid #e2b86a; background: var(--gold); color: #1a1208; font-weight: 700; }
.startbar button:disabled { background: #3a3344; color: #d9cbb8; border-color: #6a5a48; }
.nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #1a1522; border-top: 2px solid var(--gold); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; text-decoration: none; color: var(--muted); }
.nav a span { display: block; line-height: 1.2; }
.nav a[aria-current="page"] { color: var(--ember); box-shadow: inset 0 -3px 0 var(--ember); }
dialog.sheet { width: min(390px, 100vw); margin: auto auto 0; border: 2px solid var(--gold); background: #322838; color: var(--ink); padding: 16px 16px 28px; }
dialog.sheet::backdrop { background: rgba(10, 8, 14, 0.72); }
dialog.sheet[open] { animation: sheet-in 200ms var(--ease); }
@keyframes sheet-in { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
dialog.sheet h2 { margin: 0; font-size: 20px; }
dialog.sheet p { margin: 0; }
.dlg-actions { display: flex; gap: 8px; }
.dlg-actions a, .dlg-actions button { flex: 1 1 0; min-height: 48px; border: 2px solid var(--gold); background: #241c2e; color: var(--ink); display: grid; place-items: center; }
.dlg-actions a { background: var(--gold); color: #1a1208; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
@media (hover: hover) {
  .floor:hover:not(:disabled), .nav a:hover { border-color: var(--ember); }
  .nav a:hover { color: var(--ink); }
}
@media (prefers-reduced-motion: reduce) { dialog.sheet[open] { animation: none; } }
</style>
</head>
<body>
<h1 class="vh">阶梯</h1>
<div class="app">
  <div></div>
  <header class="head">
    <div class="plaque"><b>阶梯</b><span>钻石 · 大师</span></div>
  </header>
  <main class="od-scroll">
    <div class="rank">
      <b>已解锁到第 61 层</b>
      <span>最高记录 58 层 · 1:22 · 下一段位在 60 层</span>
    </div>
    <div class="list" id="list"></div>
  </main>
  <div class="startbar">
    <button type="button" id="start">开始第 61 层</button>
  </div>
  <nav class="nav" aria-label="主菜单">
    <a href="mobile-gear.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="7" y="1" width="2" height="9" fill="currentColor"/><rect x="4" y="8" width="8" height="2" fill="currentColor"/><rect x="7" y="11" width="2" height="4" fill="currentColor"/></svg><span>装备</span></a>
    <a href="mobile-tree.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="7" y="7" width="2" height="2" fill="currentColor"/><rect x="7" y="1" width="2" height="4" fill="currentColor"/><rect x="7" y="11" width="2" height="4" fill="currentColor"/><rect x="1" y="7" width="4" height="2" fill="currentColor"/><rect x="11" y="7" width="4" height="2" fill="currentColor"/></svg><span>天赋</span></a>
    <a href="mobile-forge.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="2" y="10" width="12" height="4" fill="currentColor"/><rect x="4" y="6" width="8" height="4" fill="currentColor"/><rect x="7" y="2" width="2" height="4" fill="currentColor"/></svg><span>铁砧</span></a>
    <a href="mobile-runes.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="6" y="1" width="4" height="4" fill="currentColor"/><rect x="3" y="6" width="4" height="4" fill="currentColor"/><rect x="9" y="6" width="4" height="4" fill="currentColor"/><rect x="6" y="11" width="4" height="4" fill="currentColor"/></svg><span>符文</span></a>
    <a href="mobile-ladder.html" aria-current="page"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="3" y="2" width="2" height="12" fill="currentColor"/><rect x="11" y="2" width="2" height="12" fill="currentColor"/><rect x="5" y="4" width="6" height="2" fill="currentColor"/><rect x="5" y="8" width="6" height="2" fill="currentColor"/><rect x="5" y="12" width="6" height="2" fill="currentColor"/></svg><span>阶梯</span></a>
  </nav>
  <div></div>
</div>
<dialog class="sheet" id="go">
  <form class="od-stack">
    <h2 id="goTitle">进入第 61 层</h2>
    <p id="goBody"></p>
    <div class="dlg-actions">
      <button type="button" id="goClose">留下</button>
      <a href="mobile-hud.html">查看局内</a>
    </div>
  </form>
</dialog>
<script>
(function () {
  var known = {
    61: { element: '寒霜', place: '霜冻王座', time: '', gear: '' },
    58: { element: '物理', place: '', time: '1:22', gear: '回旋骨刃' },
    55: { element: '火焰', place: '', time: '1:21', gear: '回旋骨刃' },
    52: { element: '闪电', place: '', time: '1:11', gear: '回旋骨刃' },
    49: { element: '圣光', place: '', time: '1:03', gear: '回旋骨刃' },
    46: { element: '瘟疫', place: '', time: '0:58', gear: '回旋骨刃' },
    43: { element: '寒霜', place: '', time: '0:56', gear: '回旋骨刃' },
    40: { element: '物理', place: '', time: '0:49', gear: '回旋骨刃' },
    37: { element: '火焰', place: '', time: '0:47', gear: '回旋骨刃' },
    34: { element: '闪电', place: '', time: '0:44', gear: '回旋骨刃' },
    31: { element: '物理', place: '', time: '0:42', gear: '回旋骨刃' }
  };
  var floors = [64, 63, 62, 61, 58, 55, 52, 49, 46, 43, 40, 37, 34, 31];
  var elements = ['物理', '火焰', '闪电', '圣光', '瘟疫', '寒霜'];
  var selected = 61;
  var list = document.getElementById('list');
  var start = document.getElementById('start');
  var go = document.getElementById('go');

  function info(level) {
    if (known[level]) return known[level];
    return { element: elements[level % elements.length], place: '', time: level <= 61 && level % 3 === 0 ? '1:0' + (level % 8) : '', gear: level <= 58 ? '回旋骨刃' : '' };
  }

  function render() {
    list.textContent = '';
    floors.forEach(function (level) {
      var data = info(level);
      var locked = level > 61;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'floor';
      btn.dataset.level = String(level);
      btn.disabled = locked;
      btn.setAttribute('aria-pressed', level === selected ? 'true' : 'false');
      var title = document.createElement('span');
      title.className = 'od-nowrap';
      title.textContent = '第 ' + level + ' 层';
      var mid = document.createElement('span');
      mid.textContent = data.element + (data.place ? ' · ' + data.place : '') + (locked ? '' : ' · 怪物等级 ' + level);
      var foot = document.createElement('span');
      foot.className = locked ? 'lock' : 'time od-nowrap';
      foot.textContent = locked ? '未解锁' : (data.time ? data.time + ' · ' + data.gear : '尚未通关');
      btn.appendChild(title);
      btn.appendChild(mid);
      btn.appendChild(foot);
      list.appendChild(btn);
    });
    var locked = selected > 61;
    start.disabled = locked;
    start.textContent = locked ? '未解锁' : '开始第 ' + selected + ' 层';
  }

  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    selected = Number(btn.dataset.level);
    render();
    var again = list.querySelector('[data-level="' + selected + '"]');
    if (again) again.focus();
  });

  start.addEventListener('click', function () {
    if (selected > 61) return;
    var data = info(selected);
    document.getElementById('goTitle').textContent = '进入第 ' + selected + ' 层';
    document.getElementById('goBody').textContent = (data.place || data.element) + '。限时 4:00。这是竖屏界面示意，局内画面在下一页。';
    go.showModal();
    document.getElementById('goClose').focus();
  });
  document.getElementById('goClose').addEventListener('click', function () { go.close(); });
  go.addEventListener('click', function (e) { if (e.target === go) go.close(); });
  go.addEventListener('close', function () { start.focus(); });

  render();
})();
</script>
</body>
</html>
