<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灰烬地穴 · 符文</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill { flex: 1 1 0; min-width: 0; }
  .od-fixed { flex: none; }
  .od-grid { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap { white-space: nowrap; }
  .od-keep { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding-inline: 12px; scroll-padding-inline: 12px; }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: 12px; }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */
:root {
  --bg: #2a2433; --gold: #c8913a; --ember: #ff9a3c; --ink: #f4ead8; --muted: #d2c3b0; --bad: #ff8d86;
  --font: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html { background: #120e16; }
body { width: 390px; height: 844px; margin: 0 auto; overflow: hidden; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--bg); }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.od-icon { image-rendering: pixelated; shape-rendering: crispEdges; }
.app { height: 844px; display: grid; grid-template-rows: 54px auto minmax(0, 1fr) auto 34px; }
.head { display: flex; justify-content: center; align-items: flex-end; padding-bottom: 8px; }
.plaque { text-align: center; padding: 4px 18px; background: #3a2a18; border: 2px solid var(--gold); color: #f6e2a8; }
.plaque b { display: block; font-size: 18px; line-height: 1.3; }
.tab { min-height: 44px; padding: 8px 12px; border: 2px solid #6a5433; background: #241c2e; color: var(--ink); }
.tab[aria-pressed="true"] { border-color: var(--ember); background: var(--ember); color: #1a1208; }
.od-scroll { padding: 8px 12px 12px; }
h2 { margin: 8px 0 0; font-size: 22px; }
.note, .status { margin: 4px 0 8px; color: var(--muted); }
.slots, .runes { display: grid; gap: 8px; }
.slots { grid-template-columns: 1fr 1fr; }
.slot, .rune { min-height: 64px; text-align: left; padding: 8px; border: 2px solid var(--gold); background: #241c2e; color: var(--ink); }
.slot span, .rune span { display: block; }
.slot.is-bad, .rune.is-bad { border-color: var(--bad); }
.slot.is-bad span.flag, .rune.is-bad span.flag { color: var(--bad); font-weight: 700; }
.slot.is-armed { outline: 2px solid var(--ember); }
.rune[aria-pressed="true"] { background: #4a3218; border-color: var(--ember); }
.nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #1a1522; border-top: 2px solid var(--gold); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; text-decoration: none; color: var(--muted); }
.nav a span { display: block; line-height: 1.2; }
.nav a[aria-current="page"] { color: var(--ember); box-shadow: inset 0 -3px 0 var(--ember); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
@media (hover: hover) {
  .tab:hover, .slot:hover, .rune:hover, .nav a:hover { border-color: var(--ember); }
  .nav a:hover { color: var(--ink); }
}
.nav { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)) 76px repeat(3, minmax(0,1fr)); align-items: end; background: #1a1522; border-top: 2px solid var(--gold); overflow: visible; }
.nav a { min-width: 0; font-size: 13px; min-height: 60px; }
.nav a.battle { position: relative; top: -14px; min-height: 76px; border: 2px solid #ffe08a; background: linear-gradient(#ffb25c, #c8913a); color: #1a1208; font-weight: 700; font-size: 15px; box-shadow: 0 0 0 2px #1a1208, 0 4px 0 #6b3d14; }
</style>
</head>
<body>
<h1 class="vh">符文镶嵌</h1>
<div class="app">
  <div></div>
  <header class="head"><div class="plaque"><b>符文</b></div></header>
  <main class="od-scroll">
    <div class="od-rail" id="tabs" aria-label="装备部位"></div>
    <h2 id="itemName">回旋骨刃</h2>
    <p class="note" id="rule">点选符文再点槽位，或把符文拖进槽。红色等级在此不生效。点已镶的槽可卸下。</p>
    <div class="slots" id="slots"></div>
    <h2>符文</h2>
    <div class="runes" id="runes"></div>
    <p class="status" id="status" aria-live="polite"></p>
  </main>
  <nav class="nav" aria-label="主菜单">
    <a href="mobile-gear.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="7" y="1" width="2" height="9" fill="currentColor"/><rect x="4" y="8" width="8" height="2" fill="currentColor"/><rect x="7" y="11" width="2" height="4" fill="currentColor"/></svg><span>装备</span></a>
    <a href="mobile-tree.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="7" y="7" width="2" height="2" fill="currentColor"/><rect x="7" y="1" width="2" height="4" fill="currentColor"/><rect x="7" y="11" width="2" height="4" fill="currentColor"/><rect x="1" y="7" width="4" height="2" fill="currentColor"/><rect x="11" y="7" width="4" height="2" fill="currentColor"/></svg><span>天赋</span></a>
    <a href="mobile-forge.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="2" y="10" width="12" height="4" fill="currentColor"/><rect x="4" y="6" width="8" height="4" fill="currentColor"/><rect x="7" y="2" width="2" height="4" fill="currentColor"/></svg><span>铁砧</span></a>
    <a href="mobile-hud.html" class="battle" aria-label="战斗（主线）"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:28px"><rect x="7" y="1" width="2" height="9" fill="currentColor"/><rect x="4" y="9" width="8" height="2" fill="currentColor"/><rect x="7" y="11" width="2" height="4" fill="currentColor"/><rect x="6" y="0" width="4" height="1" fill="#ffe08a"/></svg><span>战斗</span></a>
    <a href="mobile-runes.html" aria-current="page"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="6" y="1" width="4" height="4" fill="currentColor"/><rect x="3" y="6" width="4" height="4" fill="currentColor"/><rect x="9" y="6" width="4" height="4" fill="currentColor"/><rect x="6" y="11" width="4" height="4" fill="currentColor"/></svg><span>符文</span></a>
    <a href="mobile-ladder.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="3" y="2" width="2" height="12" fill="currentColor"/><rect x="11" y="2" width="2" height="12" fill="currentColor"/><rect x="5" y="4" width="6" height="2" fill="currentColor"/><rect x="5" y="8" width="6" height="2" fill="currentColor"/><rect x="5" y="12" width="6" height="2" fill="currentColor"/></svg><span>阶梯</span></a>
    <a href="mobile-settings.html"><svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true" style="--od-icon-size:20px"><rect x="6" y="1" width="4" height="3" fill="currentColor"/><rect x="6" y="12" width="4" height="3" fill="currentColor"/><rect x="1" y="6" width="3" height="4" fill="currentColor"/><rect x="12" y="6" width="3" height="4" fill="currentColor"/><rect x="5" y="5" width="6" height="6" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>设置</span></a>
  </nav>
  <div></div>
</div>
<script>
(function () {
  var runes = {
    ember: { name: '余烬', lv: 20, effect: '火焰伤害提高' },
    bone: { name: '碎骨', lv: 20, effect: '物理伤害提高' },
    shock: { name: '感电', lv: 18, effect: '闪电异常几率提高' },
    plague: { name: '疫病', lv: 8, effect: '持续伤害提高' },
    blind: { name: '致盲', lv: 4, effect: '降低敌人命中' },
    frost: { name: '冰缓', lv: 20, effect: '冰缓持续时间提高' }
  };
  var pieces = [
    { id: 'lh', name: '左手', item: '回旋骨刃', growth: false },
    { id: 'rh', name: '右手', item: '空着', growth: false },
    { id: 'head', name: '头冠', item: '霜冠', growth: false },
    { id: 'boots', name: '遁靴', item: '守夜靴', growth: false },
    { id: 'form', name: '法阵', item: '法阵', growth: true }
  ];
  var sockets = {
    lh: ['ember', 'bone', null, null],
    rh: [null, null],
    head: [null, null],
    boots: [null, null],
    form: [null]
  };
  var pool = ['shock', 'plague', 'blind', 'frost'];
  var piece = 'lh';
  var armed = null;
  var status = document.getElementById('status');

  function bad(id) {
    if (!id) return false;
    var p = pieces.filter(function (x) { return x.id === piece; })[0];
    if (p.growth) return false;
    return runes[id].lv < 15;
  }
  function say(text) { status.textContent = text; }

  function render(focus) {
    var tabs = document.getElementById('tabs');
    var slotHost = document.getElementById('slots');
    var runeHost = document.getElementById('runes');
    tabs.textContent = '';
    slotHost.textContent = '';
    runeHost.textContent = '';
    pieces.forEach(function (p) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab';
      btn.dataset.piece = p.id;
      btn.textContent = p.name;
      btn.setAttribute('aria-pressed', p.id === piece ? 'true' : 'false');
      tabs.appendChild(btn);
    });
    var current = pieces.filter(function (p) { return p.id === piece; })[0];
    document.getElementById('itemName').textContent = current.item;
    document.getElementById('rule').textContent = current.growth
      ? '法阵的槽会让符文成长，低等级也能放。点选或拖入，点槽卸下。'
      : '点选符文再点槽位，或把符文拖进槽。低于 15 级会标红，表示在此不生效。点槽卸下。';
    sockets[piece].forEach(function (id, index) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'slot' + (bad(id) ? ' is-bad' : '') + (armed ? ' is-armed' : '');
      btn.dataset.slot = String(index);
      var title = document.createElement('span');
      title.textContent = id ? runes[id].name + ' ' + runes[id].lv : '空槽 ' + (index + 1);
      var sub = document.createElement('span');
      sub.className = bad(id) ? 'flag' : '';
      sub.textContent = id ? (bad(id) ? '等级不足，在此不生效' : runes[id].effect) : (armed ? '点此镶入' : '空');
      btn.appendChild(title);
      btn.appendChild(sub);
      btn.addEventListener('dragover', function (e) { e.preventDefault(); });
      btn.addEventListener('drop', function (e) {
        e.preventDefault();
        var rid = e.dataTransfer.getData('text/plain');
        if (rid) place(rid, index, btn);
      });
      slotHost.appendChild(btn);
    });
    if (!pool.length) {
      var none = document.createElement('p');
      none.className = 'note';
      none.textContent = '符文都镶上了。点槽位可以卸下。';
      runeHost.appendChild(none);
    }
    pool.forEach(function (id) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rune' + (bad(id) ? ' is-bad' : '');
      btn.dataset.rune = id;
      btn.draggable = true;
      btn.setAttribute('aria-pressed', armed === id ? 'true' : 'false');
      var title = document.createElement('span');
      title.textContent = runes[id].name + ' · ' + runes[id].lv;
      var sub = document.createElement('span');
      sub.className = bad(id) ? 'flag' : '';
      sub.textContent = bad(id) ? '等级不足，镶上也不生效' : runes[id].effect;
      btn.appendChild(title);
      btn.appendChild(sub);
      btn.addEventListener('dragstart', function (e) {
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'move';
      });
      runeHost.appendChild(btn);
    });
    if (focus) {
      var el = document.querySelector(focus);
      if (el) el.focus();
    }
  }

  function place(id, index, trigger) {
    if (!runes[id]) return;
    var arr = sockets[piece];
    var prev = arr[index];
    if (pool.indexOf(id) === -1 && prev !== id) return;
    arr[index] = id;
    pool = pool.filter(function (x) { return x !== id; });
    if (prev) pool.push(prev);
    armed = null;
    say(bad(id) ? runes[id].name + ' 已放入，但等级不足，在此不生效' : '已镶入 ' + runes[id].name);
    render(trigger ? '[data-slot="' + index + '"]' : null);
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    piece = btn.dataset.piece;
    armed = null;
    render('[data-piece="' + piece + '"]');
  });
  document.getElementById('runes').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-rune]');
    if (!btn) return;
    armed = armed === btn.dataset.rune ? null : btn.dataset.rune;
    say(armed ? '已选中 ' + runes[armed].name + '，点一个槽位' : '已取消选择');
    render('[data-rune="' + (armed || btn.dataset.rune) + '"]');
  });
  document.getElementById('slots').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-slot]');
    if (!btn) return;
    var index = Number(btn.dataset.slot);
    if (armed) {
      place(armed, index, btn);
      return;
    }
    var id = sockets[piece][index];
    if (!id) { say('这个槽是空的'); return; }
    pool.push(id);
    sockets[piece][index] = null;
    say('已卸下 ' + runes[id].name);
    render('[data-slot="' + index + '"]');
  });

  render(null);
})();
</script>
</body>
</html>
